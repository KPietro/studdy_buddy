name: ranking
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # UI
  flutter_colorpicker: ^1.1.0
  curved_navigation_bar: ^1.0.6
  device_preview: ^1.3.1
  cached_network_image: ^3.4.1

  # LOCAL
  shared_preferences: ^2.2.2
  sqflite: ^2.4.2+1
  path_provider: ^2.1.5

  # FIREBASE
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.3.0

  # CHAT / MIDIA
  image_picker: ^1.1.2
  record: ^6.1.1
  audioplayers: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/Avatares/Avatar1.png
    - assets/Avatares/Avatar2.png

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"